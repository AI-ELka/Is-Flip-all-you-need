###
# Optimizing trigger – concrete config
###

[federated_optimizing_trigger]

# === General ===
dataset = "cifar"
model = "r32p"

source_label = 4
target_label = 9

num_honests = 7
num_poisoned = 3
agg_method = 'trmean'

output_dir = "/Data/mb/flip/out/optimizing_trigger_random/cifar10_r32p/"
device = "cuda"

# === Loss weights ===
lambda_match = 1.0
lambda_adv = 1.0
lambda_penalty = 1.0
lambda_rho = 0.01
lambda_delta = 0.0

# === Trigger optimization ===
epsilon = 1.0
lr_delta = 1e-2
n_steps = 50

# === Checkpoint sampling ===
alpha_ckpt = 0.01
num_chckpt = 5

# === Expert trajectories ===
expert_path = "/Data/mb/flip/out/checkpoints/r32p_1xs/{}/model_{}_{}.pth"

# === Initialization ===
init = "stripe"
